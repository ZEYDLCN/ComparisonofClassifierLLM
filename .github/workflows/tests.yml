name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # torch/transformers gerekmez: testler sahte API sunucusu + TF-IDF ile çalışır
      - run: pip install -e ".[dev,anthropic]" scikit-learn
      - run: python -m pytest
